<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funcionários · Rey Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Space+Mono&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-gate" id="func-login-gate">
  <div class="login-card">
    <h1>Área dos funcionários</h1>
    <p>Escolha o turno e digite a senha para registrar vendas.</p>
    <div class="field">
      <label>Turno</label>
      <select id="func-turno-select"></select>
    </div>
    <div class="field">
      <label>Senha do turno</label>
      <input type="password" id="func-login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <p class="login-error" id="func-login-error"></p>
    <button type="button" class="save-btn" id="func-login-btn">Entrar</button>
  </div>
</div>

<div id="func-app" style="display:none;">

<header class="top">
  <div class="brand">
    <span>Registrar venda — <span id="func-turno-label"></span></span>
  </div>
  <div class="admin-nav-group">
    <button type="button" class="admin-nav admin-logout-btn" id="func-logout-btn">sair</button>
  </div>
</header>

<main class="wrap">

  <section class="panel" id="func-pizzas-section">
    <h2>Pizzas</h2>
    <div id="func-pizzas-list"></div>
  </section>

  <section class="panel" id="func-salgados-section">
    <h2>Salgados</h2>
    <div id="func-salgados-list"></div>
  </section>

  <section class="panel" id="func-bebidas-section">
    <h2>Bebidas</h2>
    <div id="func-bebidas-list"></div>
  </section>

</main>

</div>

<div class="toast" id="toast">Venda registrada</div>

<script src="/static/funcionarios.js"></script>
</body>
</html>
