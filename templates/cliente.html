<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rei Pizzaria</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Space+Mono&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="info-bar">
  <span id="info-delivery"></span>
  <span id="info-min-order"></span>
  <span id="info-address"></span>
</div>

<header class="top">
  <div class="brand">
    <img class="brand-logo" id="brand-logo" src="" alt="Rey Pizzaria" style="display:none;">
    <span id="brand-name">Rei Pizzaria</span>
  </div>
  <div id="sign" class="sign">
    <span class="dot"></span>
    <span id="sign-text">carregando…</span>
  </div>
  <a href="/carrinho" class="cart-link" aria-label="Ver carrinho">
    🛒 <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
  </a>
</header>

<div class="promo-banner" id="promo-banner" style="display:none;">
  <div class="promo-banner-inner">
    <span class="txt" id="promo-banner-text"></span>
    <span class="cta">Aproveite →</span>
  </div>
</div>

<nav class="cat-nav" id="cat-nav">
  <a href="#mais-pedidos-section">Mais pedidos</a>
  <a href="#promos-section">Promoções</a>
  <a href="#pizzas-section">Pizzas</a>
  <a href="#salgados-section">Salgados</a>
  <a href="#bebidas-section">Bebidas</a>
</nav>

<main class="hero">
  <img class="logo-big" id="logo-big" src="" alt="Rey Pizzaria" style="display:none;">
  <p class="eyebrow" id="post-eyebrow">post de hoje</p>
  <h1 id="post-title">—</h1>
  <p class="lead" id="post-text"></p>
  <div class="image-slot" id="post-image">
    <span>espaço para foto do dia</span>
  </div>

  <div class="wrap" style="padding:0;">
    <div id="mais-pedidos-section" class="is-empty">
      <h2 class="section-title reveal">🔥 Mais pedidos</h2>
      <div class="highlight-row" id="mais-pedidos-row"></div>
    </div>

    <div id="promos-section">
      <h2 class="section-title reveal">Promoções</h2>
      <div class="promo-grid" id="promos-grid"></div>
    </div>

    <div id="pizzas-section">
      <h2 class="section-title reveal">Pizzas</h2>
      <div class="grid" id="pizzas-grid"></div>
    </div>

    <div id="salgados-section">
      <h2 class="section-title reveal">Salgados</h2>
      <div class="grid" id="salgados-grid"></div>
    </div>

    <div id="bebidas-section">
      <h2 class="section-title reveal">Bebidas</h2>
      <div class="grid" id="bebidas-grid"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <span id="foot-hours">18h – 2.00h</span>
  <span id="foot-address"></span>
</footer>

<script src="/static/cart.js"></script>
<script src="/static/live.js"></script>
<script src="/static/client.js"></script>
</body>
</html>
