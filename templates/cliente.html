<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rei Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Space+Mono&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <a href="/">
      <img class="brand-logo" id="brand-logo" src="" alt="Rey Pizzaria" style="display:none;">
      <span id="brand-name">Rei Pizzaria</span>
    </a>
  </div>
  <div id="sign" class="sign">
    <span class="dot"></span>
    <span id="sign-text">carregando…</span>
  </div>
</header>

<main class="hero">
  <img class="logo-big" id="logo-big" src="" alt="Rey Pizzaria" style="display:none;">
  <p class="eyebrow" id="post-eyebrow">post de hoje</p>
  <h1 id="post-title">—</h1>
  <p class="lead" id="post-text"></p>
  <div class="image-slot" id="post-image">
    <span>espaço para foto do dia</span>
  </div>

  <div class="wrap" style="padding:0;">
    <div id="promos-section">
      <h2 class="section-title">Promoções</h2>
      <div class="promo-grid" id="promos-grid"></div>
    </div>

    <div id="pizzas-section">
      <h2 class="section-title">Pizzas</h2>
      <div class="grid" id="pizzas-grid"></div>
    </div>

    <div id="salgados-section">
      <h2 class="section-title">Salgados</h2>
      <div class="grid" id="salgados-grid"></div>
    </div>

    <div id="bebidas-section">
      <h2 class="section-title">Bebidas</h2>
      <div class="grid" id="bebidas-grid"></div>
    </div>
  </div>
</main>

<footer class="foot">
  <span id="foot-hours">18h – 20h</span>
  <span id="foot-address"></span>
</footer>

<div class="cart-bar" id="cart-bar">
  <div class="cart-info">
    <span id="cart-count">0 itens</span>
    <strong id="cart-total">R$ 0,00</strong>
  </div>
  <button type="button" class="cart-checkout-btn" id="cart-checkout-btn">Finalizar no WhatsApp</button>
</div>

<div class="crop-modal" id="cart-modal" aria-hidden="true">
  <div class="crop-dialog cart-dialog" role="dialog" aria-modal="true" aria-labelledby="cart-modal-title">
    <div class="crop-header">
      <div>
        <h2 id="cart-modal-title">Confirmar pedido</h2>
        <p>Revise os itens e escreva uma observação se precisar (ex.: sem cebola).</p>
      </div>
      <button type="button" class="crop-close" id="cart-modal-close" aria-label="Fechar">×</button>
    </div>

    <div class="cart-modal-items" id="cart-modal-items"></div>

    <div class="field">
      <label>Observação geral do pedido (opcional)</label>
      <textarea id="cart-general-note" placeholder="Ex.: troco para R$ 100, entregar na portaria..."></textarea>
    </div>

    <div class="cart-modal-total">Total do pedido: <strong id="cart-modal-total">R$ 0,00</strong></div>

    <div class="crop-actions">
      <button type="button" class="crop-secondary" id="cart-modal-cancel">Voltar</button>
      <button type="button" class="save-btn crop-save" id="cart-modal-confirm">Confirmar e abrir WhatsApp</button>
    </div>
  </div>
</div>

<script src="/static/client.js"></script>
</body>
</html>
